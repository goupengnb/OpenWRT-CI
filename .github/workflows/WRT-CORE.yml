#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    #GitHub 单个作业硬上限是 6 小时，一被硬杀就什么都不剩。
    #这里设 5.5 小时，让它在被硬杀之前自己结束，日志/收尾步骤都还能正常走完。
    timeout-minutes: 330
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          #OpenWrt 官方编译依赖（openwrt/openwrt README 里的 Debian/Ubuntu 依赖清单）
          #不再使用 immortalwrt 的第三方初始化脚本
          sudo -E apt -yqq update
          sudo -E apt -yqq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget \
            dos2unix libfuse-dev python3-pyelftools python3-dev python3-yaml python3-pip libpython3-dev
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # 移除 project 的国内镜像。
          # 注意：这里不能按行 sed 删，JSON 会留下悬空逗号，
          # scripts/download.pl 解析失败会直接 die，导致【所有】源码都下载不了。
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ] && command -v python3 >/dev/null 2>&1; then
            python3 - "$PROJECT_MIRRORS_FILE" <<'PY'
          import json, re, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          pat = re.compile(r"\.cn/|tencent|aliyun", re.I)
          data = {k: [m for m in v if not pat.search(m)] for k, v in data.items()}
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent="\t")
          PY
            echo "projectsmirrors.json: 国内镜像已移除，JSON 合法性已校验"
          else
            echo "projectsmirrors.json: 不存在或缺少 python3，跳过"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Verify Key Packages
        run: |
          cd ./wrt/

          #make defconfig 会把依赖不满足的包【静默】丢掉（变成 "# ... is not set"），
          #那样编出来的固件表面正常、实际少了插件，所以这里显式检查一遍。
          EXPECTED="
          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5c
          CONFIG_PACKAGE_kmod-r8169
          CONFIG_PACKAGE_kmod-mt7921e
          CONFIG_PACKAGE_wpad-openssl
          CONFIG_PACKAGE_dnsmasq-full
          CONFIG_PACKAGE_adguardhome
          CONFIG_PACKAGE_luci-app-adguardhome
          CONFIG_PACKAGE_luci-theme-argon
          CONFIG_PACKAGE_luci-app-argon-config
          CONFIG_PACKAGE_luci-app-openclash
          CONFIG_PACKAGE_luci-app-diskman
          CONFIG_PACKAGE_ddns-go
          CONFIG_PACKAGE_luci-app-ddns-go
          CONFIG_PACKAGE_luci-app-dockerman
          "
          MISSING=0
          for PKG in $EXPECTED; do
            if grep -q "^$PKG=y$" .config; then
              echo "  [OK]   $PKG"
            elif grep -q "^$PKG=m$" .config; then
              echo "  [WARN] $PKG = m（不会装进固件，请检查）"
            else
              echo "  [FAIL] $PKG 未进入 .config（依赖缺失，已被 defconfig 丢弃）"
              MISSING=1
            fi
          done

          #Argon 是否被设成默认主题（由主题包自带 uci-defaults 完成，这里只确认包在）
          if grep -q "^CONFIG_PACKAGE_luci-theme-argon=y$" .config; then
            echo "  [OK]   Argon 主题已启用"
          fi

          #Ruby 的 YJIT 必须是关的。
          #官方 feeds 的 lang/ruby/Makefile 里写着：
          #    PKG_BUILD_DEPENDS:=ruby/host RUBY_ENABLE_YJIT:rust/host
          #    config RUBY_ENABLE_YJIT / default y if x86_64||aarch64
          #R5C 是 aarch64，一旦开着就会去【从源码交叉编译 rust 编译器(rust/host)】，
          #实测跑 3 小时以上都出不来（上游也标注了 YJIT 不支持交叉编译）。
          #放在这里拦，TEST 模式几分钟就能炸出来，不用等几个小时才发现。
          if grep -q "^CONFIG_RUBY_ENABLE_YJIT=y$" .config; then
            echo "::error::CONFIG_RUBY_ENABLE_YJIT=y —— 会触发 rust 编译器从源码编译(耗时 3 小时以上)，已中止"
            exit 1
          else
            echo "  [OK]   Ruby YJIT 已关闭（不会触发 rust 编译器编译）"
          fi

          #R5C 的设备定义（target/linux/rockchip/image/armv8.mk）里给 DEVICE_PACKAGES 写死了
          #wpad-basic-mbedtls，而 DEVICE_PACKAGES 是无条件叠进镜像、不看 .config 的。
          #本配置选的是 wpad-openssl，两者都提供 hostapd / wpa-supplicant，打镜像时 apk 会直接报
          #    ERROR: unable to select packages: ... conflicts: ...
          #Config/R5C.txt 里用官方的 DEVICE_EXTRA_PACKAGES 机制（减号前缀 = 移除）把它摘掉，
          #这里确认那一行真的活过了 make defconfig，别到编了 2 小时打镜像时才炸。
          WPAFIX='CONFIG_TARGET_DEVICE_PACKAGES_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5c="-wpad-basic-mbedtls"'
          if grep -qF "$WPAFIX" .config; then
            echo "  [OK]   R5C 设备包已移除 wpad-basic-mbedtls（不会再和 wpad-openssl 冲突）"
          else
            echo "::error::设备包移除配置没生效，打镜像时会因 wpad 包冲突失败，已中止"
            exit 1
          fi

          if [ "$MISSING" = "1" ]; then
            echo "::error::有插件没能进入 .config，已中止编译，避免编出缺插件的固件"
            exit 1
          fi

          #顺便把宿主机编译依赖也验一遍：make download / make 都会先跑这一步，
          #放在这里 TEST 模式（3 分钟）就能提前发现缺依赖，不用等真编译几个小时
          make prereq -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc) || make download -j1 V=s

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            友善 NanoPi R5C 专用固件（OpenWrt 官方源码编译）

            硬件：RK3568B2 / 4G LPDDR4X / 32G eMMC + microSD
            网口：2× 2.5G（RTL8125B，内核 r8169 驱动）
            无线：M.2 E-Key 插槽，已适配 MT7921，同时兼容原厂 RTL8822CE

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
